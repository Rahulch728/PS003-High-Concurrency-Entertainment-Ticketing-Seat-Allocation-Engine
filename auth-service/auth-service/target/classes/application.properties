spring.application.name=auth-service
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=jdbc:mysql://localhost:3306/ticketing_auth
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
# Override with the JWT_SECRET environment variable. Auth Service and API
# Gateway must use the SAME value. Falls back to a default so local dev
# works without setting anything.
jwt.secret=${JWT_SECRET:TicketingEngineSecretKeyForJwtAuthentication2026Secure}
