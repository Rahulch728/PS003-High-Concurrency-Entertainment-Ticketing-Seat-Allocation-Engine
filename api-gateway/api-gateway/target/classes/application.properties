spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=event-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://EVENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/events/**

spring.cloud.gateway.server.webflux.routes[2].id=seat-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://SEAT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/seats/**

spring.cloud.gateway.server.webflux.routes[3].id=booking-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/bookings/**


# CORS is handled once, by CorsConfig at the gateway. The downstream services
# also carry @CrossOrigin, which would otherwise add a second
# Access-Control-Allow-Origin header (browsers reject duplicates).
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

# Override with the JWT_SECRET environment variable. Auth Service and API
# Gateway must use the SAME value. Falls back to a default so local dev
# works without setting anything.
jwt.secret=${JWT_SECRET:TicketingEngineSecretKeyForJwtAuthentication2026Secure}
